<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Tabela de Tempos</title>
  <link rel="stylesheet" href="timing-table.css" />
</head>
<body>
  <div id="timing-table">
    <div class="title-bar">
      <span class="title-text" id="sessionLabel">CORRIDA</span>
      <span class="title-timer" id="sessionTimer">--:--</span>
    </div>
    <div class="header">
      <span class="col pos" id="pageLabel">Geral</span>
      <span class="col right" id="rightColumnLabel">Intervalo</span>
    </div>
    <div id="rows"></div>
  </div>

  <script src="drivers-config.js"></script>
  <script src="timing-table.js"></script>
</body>
</html>
