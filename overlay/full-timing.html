<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Tabela Completa</title>
  <link rel="stylesheet" href="full-timing.css" />
</head>
<body>
  <div id="full-timing" class="hidden">
    <div class="ft-title">
      <div class="ft-brand">
        <span id="ftBrand" class="ft-brand-name"></span>
        <span id="ftSubtitle" class="ft-brand-sub"></span>
      </div>
      <div class="ft-track">
        <img id="ftFlag" class="ft-flag" alt="" />
        <span id="ftTrack"></span>
      </div>
      <div class="ft-session">
        <span id="ftSessionLabel">CORRIDA</span>
        <span id="ftTimer" class="ft-timer"></span>
      </div>
    </div>
    <div class="ft-body">
    <div id="ftStandings" class="ft-standings" hidden></div>
    <div class="ft-table">
    <div class="ft-head">
      <div class="c-pos">POS</div>
      <div class="c-cls">CLS</div>
      <div class="c-name">PILOTO</div>
      <div class="c-logo"></div>
      <div class="c-team">EQUIPE / CARRO</div>
      <div class="c-num">LÍDER</div>
      <div class="c-num">INTERVALO</div>
      <div class="c-num">ÚLTIMA</div>
      <div class="c-best">MELHOR VOLTA</div>
      <div class="c-stint">STINT</div>
      <div class="c-gain">+/-</div>
    </div>
    <div id="ftRows"></div>
    <div id="ftPage" class="ft-page"></div>
    </div>
    <div class="ft-log">
      <div class="ft-log-head">LOG DA CORRIDA</div>
      <div id="ftLog"></div>
    </div>
    </div>
  </div>

  <script src="shared/names.js"></script>
  <script src="shared/gaps.js"></script>
  <script src="shared/colors.js"></script>
  <script src="shared/logos.js"></script>
  <script src="shared/groups.js"></script>
  <script src="shared/battles.js"></script>
  <script src="shared/display.js"></script>
  <script src="shared/points.js"></script>
  <script src="shared/championship.js"></script>
  <script src="drivers-config.js"></script>
  <script src="track-names.js"></script>
  <script src="full-timing.js"></script>
</body>
</html>
