# Monta o aplicativo no GitHub e publica um Release com o zip para download.
#
# Como disparar:
#   - criando uma tag de versao:   git tag v0.2.0   e   git push origin v0.2.0
#   - ou pelo site: aba Actions > Release > Run workflow, informando a versao
#
# O que ele faz: instala as dependencias, confere os arquivos das overlays,
# roda os testes, monta o aplicativo (npm run build), compacta a pasta e anexa
# o zip a um Release com o nome da versao.
#
# O aplicativo nao leva a chave do RLT: ela e pedida na primeira vez que abre.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão, com o v na frente (ex: v0.2.0)"
        required: true

permissions:
  contents: write # criar o Release e anexar o zip

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir a versão
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Versão '$env:VERSION' fora do formato. Use v, três números e pontos, por exemplo v0.2.0."
            exit 1
          }

      - name: Instalar dependências
        run: npm ci

      # Um erro de digitação num arquivo de configuração (drivers-config.js,
      # track-names.js) não quebra os testes, mas quebra a overlay. Melhor
      # parar aqui do que publicar um aplicativo com a tabela errada.
      - name: Conferir os arquivos das overlays e do painel
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.js -Path overlay, control-panel, server, app | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { Write-Error "Há arquivo .js com erro de sintaxe (veja acima)."; exit 1 }

      - name: Testes
        run: npm test

      # a versão do aplicativo passa a ser a da tag (sem o v)
      - name: Marcar a versão
        shell: pwsh
        run: npm version ($env:VERSION.Substring(1)) --no-git-tag-version --allow-same-version

      - name: Montar o aplicativo
        run: npm run build

      - name: Compactar
        shell: pwsh
        run: |
          Rename-Item "dist/LLG Overlay-win32-x64" "LLG Overlay"
          7z a -tzip "LLG-Overlay-$env:VERSION-win64.zip" "./dist/LLG Overlay" | Select-Object -Last 4
          Get-Item "LLG-Overlay-$env:VERSION-win64.zip" | ForEach-Object { "{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Publicar o Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Como instalar**
          1. Baixe o arquivo ``LLG-Overlay-$env:VERSION-win64.zip`` abaixo e descompacte em qualquer pasta.
          2. Abra o ``LLG Overlay.exe``. Na primeira vez o Windows pode avisar que o aplicativo é desconhecido: clique em "Mais informações" e "Executar assim mesmo".
          3. Cole a chave de acesso que você recebeu do organizador da liga.

          **Como atualizar**
          A partir desta versão, o aplicativo avisa sozinho quando sai uma versão nova: clique em "Atualizar agora" e ele fecha, instala e abre de novo. As configurações ficam guardadas fora da pasta do aplicativo e são mantidas.
          Vindo de uma versão sem o aviso (0.1.1 ou anterior): descompacte esta por cima da pasta antiga, uma vez só.
          "@
          gh release create $env:VERSION "LLG-Overlay-$env:VERSION-win64.zip" --title "LLG Overlay $env:VERSION" --notes $notes --generate-notes --target $env:GITHUB_SHA
