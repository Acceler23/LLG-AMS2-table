<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Controle</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; padding: 20px; }
    button { padding: 10px 16px; margin: 6px; font-size: 14px; cursor: pointer; }
    h3 { margin-top: 24px; margin-bottom: 8px; color: #aaa; font-size: 13px; text-transform: uppercase; }
  </style>
</head>
<body>
  <h2>Painel de Controle</h2>

  <h3>Overlay</h3>
  <button onclick="send('overlay.prevPage')">Página ← [</button>
  <button onclick="send('overlay.nextPage')">Página → ]</button>
  <button onclick="send('overlay.prevColumn')">Coluna ← ,</button>
  <button onclick="send('overlay.nextColumn')">Coluna → .</button>
  <button onclick="send('overlay.toggleHighlight')">Destaque (p)</button>

  <h3>OBS</h3>
  <button onclick="send('obs.setScene', { scene: 'Corrida' })">Cena: Corrida</button>
  <button onclick="send('obs.setScene', { scene: 'Boxes' })">Cena: Boxes</button>
  <button onclick="send('obs.startRecord')">Iniciar gravacao</button>
  <button onclick="send('obs.stopRecord')">Parar gravacao</button>

  <script src="panel.js"></script>
</body>
</html>
