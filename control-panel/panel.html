<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Controle</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; padding: 20px; max-width: 720px; }
    button { padding: 10px 16px; margin: 6px 6px 6px 0; font-size: 14px; cursor: pointer; }
    h3 { margin-top: 24px; margin-bottom: 8px; color: #aaa; font-size: 13px; text-transform: uppercase; }
    input, select { padding: 8px; font-size: 14px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    .row input { flex: 1; }
    .box { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-top: 8px; }
    .class-chip { display: inline-block; padding: 4px 10px; margin: 4px 4px 0 0; border-radius: 4px; font-size: 12px; font-weight: 700; }
    #rltLog { font-family: monospace; font-size: 12px; color: #9f9; white-space: pre-wrap; max-height: 180px; overflow: auto; background: #0a0a0a; padding: 8px; border-radius: 4px; }
    .muted { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Painel de Controle</h2>

  <h3>Overlay</h3>
  <button onclick="send('overlay.prevPage')">Página ← [</button>
  <button onclick="send('overlay.nextPage')">Página → ]</button>
  <button onclick="send('overlay.prevColumn')">Coluna ← ,</button>
  <button onclick="send('overlay.nextColumn')">Coluna → .</button>
  <button onclick="send('overlay.toggleHighlight')">Destaque (p)</button>

  <h3>Racing League Tools</h3>
  <div class="box">
    <div class="muted">API key (header X-API-Key) — <a href="https://racingleaguetools.com/api/docs/" target="_blank" style="color:#6cf">docs</a></div>
    <div class="row">
      <input id="rltKey" type="password" placeholder="Cole a API key" />
      <button onclick="saveKey()">Salvar key</button>
      <button onclick="clearRlt()">Limpar</button>
    </div>
    <div class="row">
      <select id="rltSeason"><option value="">— só dados do jogo (sem season) —</option></select>
      <button onclick="applySeason()">Aplicar</button>
      <button onclick="reloadSeasons()">Recarregar</button>
    </div>
    <div id="rltClasses"></div>
    <div class="muted" id="rltStatus"></div>
    <div id="rltLog"></div>
  </div>

  <h3>OBS</h3>
  <button onclick="send('obs.setScene', { scene: 'Corrida' })">Cena: Corrida</button>
  <button onclick="send('obs.setScene', { scene: 'Boxes' })">Cena: Boxes</button>
  <button onclick="send('obs.startRecord')">Iniciar gravacao</button>
  <button onclick="send('obs.stopRecord')">Parar gravacao</button>

  <script src="panel.js"></script>
</body>
</html>
